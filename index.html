         for the header/footer nav preview (Navigation/SiteHeader.tsx, SiteFooter.tsx), matches
         nuxt-storefront's nuxt.config.ts. Arial/Georgia are system fonts, not loaded here. -->

    <!-- Display fonts + 700–900 weights for the Scrolling Text Banner (Media/ScrollingText.tsx's
         DISPLAY_FONT_OPTIONS + bold FONT_OPTIONS weights). Browsers only download a face once text
         actually uses it. Matches nuxt-storefront's nuxt.config.ts. -->
